name: "FloodWatch Community — CI/CD"

on:
  push:
    branches: [testing]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: "TypeScript Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit
        env:
          JAVA_API_URL: "http://localhost:4001"
          AUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
          AUTH_URL: "http://localhost:3002"
          CRM_URL: "http://localhost:3000"
          NEXT_PUBLIC_CRM_URL: "http://localhost:3000"
          FLOODWATCH_API_BASE: "http://localhost/api/v1"
          FLOODWATCH_DATASET: "sample"
          REDIS_URL: ""
          NEXT_PUBLIC_GOOGLE_MAPS_KEY: ""
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ""

  promote:
    name: "Promote to production branch"
    needs: test
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push testing to production branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin
          git checkout production
          git reset --hard origin/testing
          git push origin production --force